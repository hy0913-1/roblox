<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>림버스 디펜스 - 버스를 지켜라 (비영리 팬게임)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
      body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #0b0b10; color: #efe6c8;
        font: 700 20px/1.6 "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      #rotate small { display: block; color: #8c8a99; font-weight: 500; font-size: 14px; margin-top: 6px; }
      /* 세로로 든 폰에서는 가로 모드를 안내한다. (게임은 가로 16:9 기준) */
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div>기기를 가로로 돌려주세요<small>가로 화면에서 플레이할 수 있어요</small></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
