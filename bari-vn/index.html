<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!--HEAD-->
<title>하얀 달의 닷새</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 배치: 한 화면짜리 무대. 배경 → 인물 → 아래 대사창, 위에는 얇은 머리띠. 밤과 강물의 한 가지 색조로만 간다(단일 테마). */
:root {
  color-scheme: dark;
  --ink: #0a1020;         /* 밤하늘 바탕 */
  --ink-2: #131c33;       /* 대사창·판 */
  --line: #2c3a5e;        /* 테두리 */
  --moon: #eef2f8;        /* 본문 글자, 하얀 달 */
  --mist: #9aa8c4;        /* 보조 글자 */
  --river: #5b9be6;       /* 바리의 푸른색, 강조 */
  --petal: #f0b8c4;       /* 호감 꽃잎 */
  --font-story: "Gowun Batang", "Noto Serif KR", "Batang", serif;
  --font-ui: "Gowun Dodum", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--moon); font-family: var(--font-ui); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }

#stage { position: relative; height: 100%; max-width: 1200px; margin: 0 auto; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; }
#bg, #bg > * { position: absolute; inset: 0; width: 100%; height: 100%; }
#bg img { object-fit: cover; }
#bg { transition: opacity .45s; }
#sprite { position: absolute; left: 50%; bottom: 0; height: 92%; aspect-ratio: 4 / 7; transform: translateX(-50%); transition: opacity .35s, transform .35s; pointer-events: none; }
#sprite.off { opacity: 0; transform: translateX(-50%) translateY(12px); }
#sprite > * { width: 100%; height: 100%; display: block; }
#sprite img { object-fit: contain; object-position: bottom; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

#top { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 12px; padding-block: 10px; background: linear-gradient(var(--ink), transparent); font-size: 14px; }
#chapter { color: var(--mist); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#aff { display: flex; align-items: center; gap: 3px; color: var(--mist); }
#aff i { width: 11px; height: 11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 1px solid var(--petal); opacity: .45; transition: all .4s; }
#aff i.on { background: var(--petal); opacity: 1; }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; color: var(--mist); }
.tbtn:hover { color: var(--moon); border-color: var(--river); }

#dialog { position: absolute; inset: auto 0 0 0; padding-block: 0 16px; }
#box { position: relative; max-width: 860px; margin: 0 auto; min-height: 132px; box-sizing: border-box; padding: 26px 22px 30px; background: color-mix(in srgb, var(--ink-2) 90%, transparent); border: 1px solid var(--line); border-top: 2px solid var(--river); cursor: pointer; }
#who { position: absolute; top: -17px; left: 18px; padding: 3px 14px; background: var(--river); color: var(--ink); font-family: var(--font-story); font-weight: 700; font-size: 15px; }
#text { font-family: var(--font-story); font-size: clamp(16px, 2.3vw, 19px); line-height: 1.8; white-space: pre-wrap; word-break: keep-all; }
#text.narr { color: var(--mist); }
#text.think { font-style: italic; }
#next { position: absolute; right: 16px; bottom: 9px; color: var(--river); font-size: 12px; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

#choices { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; background: color-mix(in srgb, var(--ink) 55%, transparent); }
#choices button { width: min(100%, 560px); padding: 14px 18px; text-align: left; font-family: var(--font-story); font-size: 16px; line-height: 1.5; word-break: keep-all; background: var(--ink-2); border: 1px solid var(--line); border-left: 3px solid var(--river); }
#choices button:hover { border-color: var(--river); background: var(--line); }

.cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding-block: 24px; background: color-mix(in srgb, var(--ink) 80%, transparent); overflow-y: auto; }
#card { cursor: pointer; background: var(--ink); }
#card small { color: var(--river); letter-spacing: .3em; }
#card h2, #end h2 { margin: 0; font-family: var(--font-story); font-size: clamp(26px, 5vw, 40px); font-weight: 700; text-wrap: balance; }
#title h1 { margin: 0; font-family: var(--font-story); font-size: clamp(34px, 8vw, 64px); font-weight: 700; letter-spacing: .04em; text-shadow: 0 0 30px color-mix(in srgb, var(--moon) 45%, transparent); }
#title .sub { color: var(--river); letter-spacing: .25em; font-size: 13px; }
#title p, #end p { margin: 0; max-width: 34em; color: var(--mist); font-size: 13px; line-height: 1.7; word-break: keep-all; }
#title label { color: var(--mist); font-size: 13px; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
#name { font: inherit; font-size: 16px; text-align: center; color: var(--moon); background: var(--ink-2); border: 1px solid var(--line); padding: 9px; width: 200px; }
.big { min-width: 200px; padding: 12px 20px; font-family: var(--font-story); font-size: 17px; background: var(--river); color: var(--ink); border: 0; font-weight: 700; }
.big.ghost { background: none; color: var(--moon); border: 1px solid var(--line); font-weight: 400; }
.big:hover { filter: brightness(1.12); }
#end small { color: var(--petal); letter-spacing: .3em; }

#log { align-items: stretch; justify-content: flex-start; text-align: left; background: var(--ink); }
#log header { display: flex; justify-content: space-between; align-items: center; }
#logbody { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; font-family: var(--font-story); line-height: 1.7; }
#logbody b { color: var(--river); margin-right: 8px; }
#logbody div.n { color: var(--mist); }
#toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; color: var(--petal); background: var(--ink-2); border: 1px solid var(--petal); opacity: 0; transition: opacity .4s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; }
@media (max-width: 600px) { #sprite { height: 80%; bottom: 60px; } #box { min-height: 150px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<div id="stage">
  <div id="bg"></div>
  <div id="sprite" class="off"></div>

  <div id="top" class="gutter" hidden>
    <span id="chapter"></span>
    <span id="aff" title="호감도"><i></i><i></i><i></i><i></i><i></i></span>
    <button class="tbtn" id="btn-log" type="button">기록</button>
    <button class="tbtn" id="btn-snd" type="button">소리 켬</button>
    <button class="tbtn" id="btn-home" type="button">처음으로</button>
  </div>
  <div id="toast"></div>

  <div id="dialog" class="gutter" hidden>
    <div id="box" role="button" tabindex="0" aria-label="다음 대사">
      <span id="who"></span>
      <div id="text"></div>
      <span id="next">▼</span>
    </div>
  </div>

  <div id="choices" class="gutter" hidden></div>

  <div id="card" class="cover gutter" hidden><small id="card-a"></small><h2 id="card-b"></h2></div>

  <div id="end" class="cover gutter" hidden>
    <small id="end-a"></small><h2 id="end-b"></h2><p id="end-c"></p>
    <button class="big" id="btn-again" type="button">처음으로</button>
  </div>

  <div id="log" class="cover gutter" hidden>
    <header><strong>지난 대화</strong><button class="tbtn" id="btn-logx" type="button">닫기</button></header>
    <div id="logbody"></div>
  </div>

  <div id="title" class="cover gutter">
    <span class="sub">바리 팬 비주얼 노벨</span>
    <h1>하얀 달의 닷새</h1>
    <p>신입 직원인 당신에게 닷새짜리 안내 업무가 떨어졌습니다. 상대는 꽃을 찾아 강을 따라 걷는 해결사, 바리.</p>
    <label for="name">당신의 이름<input id="name" maxlength="8" value="신입" autocomplete="off"></label>
    <button class="big" id="btn-start" type="button">처음부터</button>
    <button class="big ghost" id="btn-cont" type="button" hidden>이어하기</button>
    <p id="seen"></p>
    <p>Project Moon과 무관한 비영리 팬 제작물입니다. 원작의 모든 권리는 원저작권자에게 있습니다. 이야기는 창작이며 「림버스 컴퍼니」 7장의 내용을 약하게 암시합니다.</p>
  </div>
</div>

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('bari-vn:' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('bari-vn:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('bari-vn:' + k); } catch {} },
};
function blip(f, d) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + (d || .12));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + (d || .12));
  } catch {}
}
const fill = s => s.replaceAll('{name}', S.name);

function paint() {
  if (!S) { $('bg').innerHTML = bgSVG('rooftop'); return; }
  $('bg').innerHTML = ART.bg[S.bg] ? `<img src="${ART.bg[S.bg]}" alt="">` : bgSVG(S.bg);
  const img = ART.sprite[S.expr] || ART.sprite.default;
  $('sprite').innerHTML = img ? `<img src="${img}" alt="바리">` : bariSVG(S.expr);
  $('sprite').classList.toggle('off', !S.vis);
  $('chapter').textContent = S.chapter;
  const on = Math.round(S.aff / MAX_AFF * 5);
  [...$('aff').children].forEach((el, i) => el.classList.toggle('on', i < on));
}
function say(who, text, cls) {
  full = fill(text);
  $('who').textContent = who; $('who').hidden = !who;
  $('text').className = cls || '';
  log.push([who, full]); if (log.length > 200) log.shift();
  $('next').hidden = true; $('text').textContent = '';
  let n = 0; clearInterval(typing);
  typing = setInterval(() => {
    n++; $('text').textContent = full.slice(0, n);
    if (n >= full.length) endType();
  }, 26);
  waiting = 'line';
}
function endType() { clearInterval(typing); typing = null; $('text').textContent = full; $('next').hidden = false; }

function run() {
  for (;;) {
    const n = STORY[S.i];
    if (!n) return;
    store.set('save', S);
    const k = n[0];
    if (k === 'bg') { S.bg = n[1]; paint(); }
    else if (k === 'show') { S.vis = true; paint(); }
    else if (k === 'hide') { S.vis = false; paint(); }
    else if (k === 'L') {}
    else if (k === 'J') { S.i = labels[n[1]]; continue; }
    else if (k === 'route') { S.i = labels[S.aff >= ROUTE_A ? 'endA' : S.aff >= ROUTE_B ? 'endB' : 'endC']; continue; }
    else if (k === 'chapter') {
      S.chapter = n[1] + ' · ' + n[2]; paint();
      $('card-a').textContent = n[1]; $('card-b').textContent = n[2];
      $('card').hidden = false; $('dialog').hidden = true; waiting = 'card'; return;
    }
    else if (k === 'N') { say('', n[1], 'narr'); return; }
    else if (k === 'M') { say(n[1].startsWith('(') ? '' : S.name, n[1], n[1].startsWith('(') ? 'think' : ''); return; }
    else if (k === 'B') { S.expr = n[1]; S.vis = true; paint(); say('바리', n[2]); return; }
    else if (k === 'O') { say(n[1], n[2]); return; }
    else if (k === 'C') { choose(n[1]); return; }
    else if (k === 'end') { finish(n[1]); return; }
    S.i++;
  }
}
function advance() {
  if (waiting === 'line') {
    if (typing) { endType(); return; }
    blip(520, .06); S.i++; run();
  } else if (waiting === 'card') {
    $('card').hidden = true; $('dialog').hidden = false; $('text').textContent = ''; $('who').hidden = true; S.i++; run();
  }
}
function choose(opts) {
  waiting = 'choice';
  const box = $('choices'); box.innerHTML = ''; box.hidden = false;
  opts.forEach(([t, aff, go], i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'choice-' + i; b.textContent = fill(t);
    b.onclick = () => {
      box.hidden = true; log.push(['선택', fill(t)]);
      if (aff > 0) { S.aff += aff; toast(aff >= 2 ? '바리의 마음에 깊이 남았다' : '바리가 미소 지었다'); blip(880, .25); setTimeout(() => blip(1175, .3), 110); } else blip(330, .1);
      S.i = labels[go]; paint(); run();
    };
    box.appendChild(b);
  });
  box.firstChild.focus();
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
function finish(key) {
  waiting = null; store.del('save');
  const seen = store.get('ends') || []; if (!seen.includes(key)) { seen.push(key); store.set('ends', seen); }
  const [a, b, c] = ENDS[key];
  $('end-a').textContent = a; $('end-b').textContent = b; $('end-c').textContent = c;
  $('dialog').hidden = true; $('end').hidden = false;
}
function begin(state) {
  S = state; log = [];
  for (const id of ['title', 'end', 'card', 'choices', 'log']) $(id).hidden = true;
  $('top').hidden = false; $('dialog').hidden = false; $('text').textContent = '';
  paint(); run();
}
function home() {
  clearInterval(typing); typing = null; waiting = null; S = null;
  for (const id of ['top', 'dialog', 'end', 'card', 'choices', 'log']) $(id).hidden = true;
  $('sprite').classList.add('off'); $('title').hidden = false;
  $('btn-cont').hidden = !store.get('save');
  const seen = (store.get('ends') || []).length;
  $('seen').textContent = seen ? `지금까지 본 맺음 ${seen} / 3` : '';
  paint();
}

$('btn-start').onclick = () => begin({ i: 0, aff: 0, name: $('name').value.trim() || '신입', bg: 'office', expr: 'normal', vis: false, chapter: '' });
$('btn-cont').onclick = () => { const s = store.get('save'); if (s) begin(s); };
$('btn-again').onclick = home;
$('btn-home').onclick = home;
$('btn-snd').onclick = e => { sound = !sound; e.currentTarget.textContent = sound ? '소리 켬' : '소리 끔'; };
$('btn-log').onclick = () => {
  $('logbody').innerHTML = '';
  for (const [w, t] of log) { const d = document.createElement('div'); if (!w) d.className = 'n'; if (w) { const b = document.createElement('b'); b.textContent = w; d.appendChild(b); } d.appendChild(document.createTextNode(t)); $('logbody').appendChild(d); }
  $('log').hidden = false; $('log').scrollTop = $('log').scrollHeight;
};
$('btn-logx').onclick = () => { $('log').hidden = true; };
$('box').onclick = advance;
$('card').onclick = advance;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  if ((e.key === ' ' || e.key === 'Enter') && $('log').hidden) { e.preventDefault(); advance(); }
  if (e.key === 'Escape') $('log').hidden = true;
});

home();
loadArt();
</script>
