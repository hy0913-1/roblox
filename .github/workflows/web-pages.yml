# OX 도트 대난투 웹판을 GitHub Pages에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
# 그다음부터는 main에 합쳐질 때마다 자동으로 다시 올라간다(Actions 탭에서 손으로 돌릴 수도 있음).
name: 웹게임 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'ox-quiz/**'
      - 'bari-vn/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pages가 아직 꺼져 있으면 실패 대신 안내만 남기고 건너뛴다
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages가 아직 꺼져 있어서 배포를 건너뛰었어요. Settings → Pages → Source를 'GitHub Actions'로 바꾼 뒤 Actions 탭에서 이 워크플로를 다시 돌려 주세요."
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quiz:test
      - run: npm run quiz:web
      # 바리 비주얼 노벨은 빌드가 필요 없는 정적 파일이라 그대로 /bari-vn/ 아래에 얹는다
      - run: mkdir -p ox-quiz/dist-web/bari-vn && cp -r bari-vn/index.html bari-vn/assets ox-quiz/dist-web/bari-vn/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ox-quiz/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
